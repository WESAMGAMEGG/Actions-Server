name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'  # Run every 5 hours

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '22'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Playit.gg
        run: |
          curl -SsL https://playit-cloud.github.io/ppa/key.gpg | sudo gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/playit.gpg >/dev/null
          echo "deb https://playit-cloud.github.io/ppa/ $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/playit-cloud.list
          sudo apt update
          sudo apt install playit

      - name: Run Minecraft Server and Playit
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          cd $GITHUB_WORKSPACE
          
          # قبول اتفاقية eula.txt تلقائياً
          echo "eula=true" > eula.txt

          # تشغيل سيرفر ماين كرافت (Spigot)
          echo "Starting Minecraft Server..."
          java -Xms4G -Xmx4G -jar spigot.jar nogui &
          SPIGOT_PID=$!

          # تشغيل Playit.gg باستخدام السر المخزّن
          echo "Starting Playit.gg Tunnel..."
          playit --secret "${PLAYIT_SECRET}" &
          PLAYIT_PID=$!

          # ابقِ الـ Workflow حياً
          while true; do
            if ! kill -0 $SPIGOT_PID 2>/dev/null; then
              echo "Minecraft server stopped, restarting..."
              java -Xms4G -Xmx4G -jar spigot.jar nogui &
              SPIGOT_PID=$!
            fi
            sleep 30
          done
